# Proves that both create-nextstarter starting points still work.
#
# .nextstarter/apply.mjs turns this repository (the NextStarter marketing site)
# into a fresh project, in either "blank" or "full" mode. Changes to the
# marketing site can break that without breaking the site itself — a removed
# file one of the overlays imports, a test that assumes the landing page — so
# each mode is applied to a clean checkout and linted, built, and tested here,
# before anyone scaffolds from it.
#
# The apply script deletes this workflow from the projects it creates.
name: Scaffold
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  scaffold:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        mode: [ blank, full ]
    name: ${{ matrix.mode }}
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: Scaffold Test
      NEXT_PUBLIC_SITE_META_DESCRIPTION: A project created from the NextStarter template.
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Apply the ${{ matrix.mode }} starting point
      run: node .nextstarter/apply.mjs ${{ matrix.mode }}
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Build
      run: npm run build
    - name: Run Playwright tests
      run: npx playwright test --project=chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.mode }}
        path: playwright-report/
        retention-days: 30
