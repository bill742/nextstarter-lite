# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '25 23 * * 5'

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # `npm ci` installs the ESLint version package-lock.json pins along with
      # every plugin eslint.config.mjs loads, so CI lints with the same
      # toolchain as `npm run lint` locally. Previously this step installed a
      # standalone `eslint@9.28.0` and no plugins, which both drifted from the
      # project and left the config unable to resolve what it imports.
      #
      # The SARIF formatter is only needed for this upload, so it is installed
      # with --no-save rather than being added to the project's dependencies.
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @microsoft/eslint-formatter-sarif@3.1.0

      # `--ext` is intentionally absent: flat config selects files itself, and
      # the flag is a no-op under eslint.config.mjs.
      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: npx eslint .
          --config eslint.config.mjs
          --format @microsoft/eslint-formatter-sarif
          --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
