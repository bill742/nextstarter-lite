name: Image Optimizer Probe

# TEMPORARY. Delete this file once the /_next/image hang is understood.
#
# `Verify the product screenshots load and are captioned` fails on chromium and
# firefox because /_next/image never answers for whichever screenshot the test
# asks for first, while the other two are served in milliseconds. It does not
# reproduce on macOS. This probe talks to the optimizer directly, inside the
# same container CI uses, to find out whether the hang follows the *file* or
# the *position in the request order*.

on:
  push:
    branches: [ diagnose-image-optimizer-hang ]
  workflow_dispatch:

jobs:
  probe:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    env:
      NEXT_PUBLIC_SITE_URL: https://www.nextstarter.app
      NEXT_PUBLIC_SITE_NAME: NextStarter
      NEXT_PUBLIC_SITE_META_DESCRIPTION: A modern Next.js boilerplate for building production-ready web applications.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Report the environment
        run: |
          echo "node        $(node -v)"
          echo "cpus        $(node -p 'require("os").cpus().length')"
          echo "totalmem    $(node -p 'Math.round(require("os").totalmem()/1e6)+" MB"')"
          echo "uid/gid     $(id -u)/$(id -g)  home=$HOME"
          node -e 'const s=require("sharp");console.log("sharp",s.versions.sharp,"vips",s.versions.vips,"concurrency",s.concurrency())' \
            || echo "sharp: FAILED TO LOAD"

      - name: Build Next.js app
        run: npm run build

      - name: How does this container resolve localhost?
        run: |
          echo "--- /etc/hosts ---"; cat /etc/hosts
          echo "--- getent hosts localhost ---"; getent hosts localhost || echo "(none)"
          echo "--- getent ahosts localhost ---"; getent ahosts localhost || echo "(none)"

      - name: Probe the optimizer over curl
        run: bash .github/scripts/probe-image-optimizer.sh

      # The decisive comparison: one server, one container, the same page loaded
      # once per address. If localhost stalls and 127.0.0.1 does not, the bug is
      # address resolution and the image was never involved.
      - name: Probe with a real browser, both addresses
        run: |
          rm -rf .next/cache/images
          npm run start > /tmp/server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sS -o /dev/null --max-time 2 http://127.0.0.1:3000/pro 2>/dev/null && break
            sleep 1
          done

          echo "--- listening sockets ---"
          (ss -ltn || netstat -ltn || true) 2>&1 | head -20
          echo "--- reachability, before any browser runs ---"
          curl -sS -o /dev/null --max-time 10 \
            -w 'localhost   status=%{http_code} time=%{time_total}\n' \
            http://localhost:3000/pro || echo "localhost   UNREACHABLE (curl exit $?)"
          curl -sS -o /dev/null --max-time 10 \
            -w '127.0.0.1   status=%{http_code} time=%{time_total}\n' \
            http://127.0.0.1:3000/pro || echo "127.0.0.1   UNREACHABLE (curl exit $?)"

          # Each engine gets a cold image cache so the first request is always
          # a real encode, never a cache hit from the previous engine.
          for engine in chromium firefox webkit; do
            for base in http://localhost:3000 http://127.0.0.1:3000; do
              rm -rf .next/cache/images
              node .github/scripts/probe-image-browser.mjs "$base" "$engine" || true
            done
          done

          echo "--- server output ---"
          cat /tmp/server.log
