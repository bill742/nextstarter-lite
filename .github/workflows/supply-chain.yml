# Supply-chain verification.
#
# npm has no install-time equivalent of pnpm's `trustPolicy: no-downgrade`, so
# the trust check runs in CI instead. `npm audit signatures` verifies every
# installed package's tarball against the signature the registry published for
# it, and reports how many carry a provenance attestation proving which build
# produced them. A tampered or unsigned package fails the job.
#
# The release-age half of the hardening lives in .github/dependabot.yml.

name: Supply chain

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, matching the cadence of the ESLint workflow. Catches a package
    # that is revoked or re-signed after it was already in the lockfile.
    - cron: "25 23 * * 5"

permissions:
  contents: read

jobs:
  verify:
    name: Verify dependency signatures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      # `npm ci` installs strictly from package-lock.json, so this verifies the
      # exact tree a build would use rather than a fresh resolution.
      - name: Install dependencies
        run: npm ci

      - name: Verify registry signatures
        run: npm audit signatures

      # Known advisories. Scoped to high and above so a low-severity transitive
      # advisory does not block every pull request.
      #
      # ALLOWLIST holds advisories with no patched release that cannot be
      # exploited here. Every other high or critical advisory still fails the
      # job. Remove an entry as soon as a fix ships.
      #
      # - GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, no fix yet): reached only via
      #   @next/eslint-plugin-next -> fast-glob -> micromatch at lint time,
      #   which expands the project's own glob patterns, never external input.
      - name: Audit for known vulnerabilities
        env:
          ALLOWLIST: GHSA-vfj7-8cjw-p6xm
        run: |
          npm audit --json > audit.json || true
          jq -e '.vulnerabilities' audit.json > /dev/null || { cat audit.json; exit 1; }
          jq -r --arg allow "$ALLOWLIST" '
            ($allow | split(" ")) as $ids
            | [.vulnerabilities[].via[] | objects]
            | unique_by(.url)
            | map(select(.severity == "high" or .severity == "critical"))
            | map(select((.url | split("/") | last) as $id | $ids | index($id) | not))
            | .[] | "\(.severity)\t\(.name)\t\(.url)\t\(.title)"
          ' audit.json > blocking.txt
          if [ -s blocking.txt ]; then
            echo "::error::High or critical advisories found:"
            cat blocking.txt
            exit 1
          fi
          echo "No blocking advisories (allowlisted: $ALLOWLIST)."
