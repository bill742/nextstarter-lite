# Dependabot configuration.
#
# Why this file exists: this project installs with npm — package-lock.json is
# the tracked lockfile — so the `minimumReleaseAge` and `trustPolicy` settings
# in pnpm-workspace.yaml never run on the real install path. They still apply
# to anyone who clones this starter and uses pnpm; `cooldown` below is the
# npm-side equivalent for this repository.
#
# `cooldown` holds a routine dependency bump until the release has been public
# for 7 days. A hijacked release is typically caught and unpublished within
# hours, so the delay means a poisoned version expires before it is ever
# proposed here. Same reasoning as pnpm's `minimumReleaseAge: 10080`.
#
# Cooldown applies to version updates only — Dependabot security updates are
# exempt by design, so a genuine vulnerability fix still lands immediately
# instead of waiting out the delay.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      # Routine bumps arrive as one PR instead of one per package. Majors stay
      # ungrouped so each potentially breaking change gets its own review.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # ESLint 10 is on hold: eslint-plugin-react, eslint-plugin-jsx-a11y and
      # eslint-plugin-import (all pulled in by eslint-config-next) still cap
      # their eslint peer range at ^9. Lift this once eslint-plugin-react
      # ships a release that supports ^10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go) port and drops the classic compiler
      # API that typescript-eslint relies on; its peer range stops at <6.1.0.
      # 6.x bumps still come through. Lift this once typescript-eslint
      # supports 7.
      - dependency-name: "typescript"
        versions: [">=7"]
      # @types/node tracks the runtime major in .node-version and
      # engines.node. Bump all three together when moving to a new Node line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
